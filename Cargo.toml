[package]
name = "wlvl"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Userspace wear-leveling block device for SD cards and USB drives (ublk)"
license = "MIT OR Apache-2.0"

[lib]
name = "wlvl"
path = "src/lib.rs"

[[bin]]
name = "wlvl"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crc32c = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(target_os = "linux")'.dependencies]
ctrlc = { version = "3", features = ["termination"] }
io-uring = "0.7"
libc = "0.2"
libublk = "0.4"
nix = { version = "0.31", features = ["ioctl", "sched", "fs"] }
smol = "2"

[dev-dependencies]
tempfile = "3"

[features]
# End-to-end tests that create real ublk devices. Need root, Linux >= 6.0 and ublk_drv.
e2e = []
